name: Holy Rust CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, riscv32imac-unknown-none-elf]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --target ${{ matrix.target }} --release -- -D warnings

      - name: Build (dev)
        run: cargo build --target ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --target ${{ matrix.target }} --release

      - name: Verify no dynamic allocation
        run: |
          grep -q '^alloc' Cargo.toml && exit 1 || echo "no alloc dependency - PASS"
          if grep -rn "extern crate alloc" src/; then exit 1; fi
          echo "no alloc crate in src - PASS"

  qemu-smoke:
    name: QEMU smoke test (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm-cortex-m4
            target: thumbv7em-none-eabihf
            packages: qemu-system-arm
            machine: netduinoplus2
            qemu: qemu-system-arm
            extra_flags: ""
          - name: riscv-rv32imac
            target: riscv32imac-unknown-none-elf
            packages: qemu-system-misc
            machine: sifive_e
            qemu: qemu-system-riscv32
            extra_flags: "-bios none"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Build (release)
        run: cargo build --target ${{ matrix.target }} --release

      - name: REPL smoke test
        run: |
          set -e
          KERNEL="target/${{ matrix.target }}/release/holy-rust"
          # Pipe a scripted session into the guest UART; timeout guarantees
          # the job can never hang on a wedged emulator.
          (
            sleep 1
            printf '2+3;\r\n'
            sleep 0.5
            printf 'let x = 42;\r\n'
            sleep 0.5
            printf 'x * x;\r\n'
            sleep 0.5
            printf 'cap_claim GPIOA;\r\n'
            sleep 0.5
            printf 'cap_claim GPIOA;\r\n'
            sleep 0.5
            printf 'cap_drop GPIOA;\r\n'
            sleep 1
          ) | timeout 20 ${{ matrix.qemu }} -M ${{ matrix.machine }} \
              ${{ matrix.extra_flags }} -nographic -monitor none \
              -serial stdio -kernel "$KERNEL" > session.log || true

          cat session.log
          grep -q "= 0x00000005 (5)"        session.log
          grep -q "x = 0x0000002A (42)"     session.log
          grep -q "= 0x000006E4 (1764)"     session.log
          grep -q "CAP CLAIMED GPIOA"       session.log
          grep -q "CAP BUSY GPIOA"          session.log
          grep -q "CAP RELEASED GPIOA"      session.log
          echo "REPL smoke test - PASS"
